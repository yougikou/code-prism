      eip_usage:
        title: EIP 使用数量（按 Java 文件）
        tech_stacks: []
        include_children: true
        group_by:
          - file_path
        chart_type: bar_row
        change_type_mode: switchable
        width: 2
        trend: true
        func:
          type: sum
          analyzer_id: camel_java_production_metrics
          tag_filters:
            metric: eip_usage_count

      endpoint_component_usage:
