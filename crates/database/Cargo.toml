[package]
name = "codeprism-database"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
codeprism-core = { version = "0.1.0", path = "../core" }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
