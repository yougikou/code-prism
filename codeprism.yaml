      metric_key: log_trace
      category: logging
      description: null
      tags: {}
      scan_mode: null
      change_type: null
    log_debug_finder:
      pattern: \b(?:debug!|console\.debug\b|(?:\w*[Ll]og(?:ger|ging)?)\.debug\b)
