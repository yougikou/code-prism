name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CODEPRISM_SKIP_WEB_BUILD: '1'

jobs:
  quality:
    name: Frontend, Rust, and analyzer quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@$(node scripts/dev.mjs npm-version)
        shell: bash
      - id: rust-toolchain
        run: echo "version=$(node scripts/dev.mjs rust-toolchain-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - name: Check version alignment
        run: node scripts/dev.mjs version-check
      - name: Run unified checks
        run: npm run check
