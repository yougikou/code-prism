name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and validate release source
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@$(node scripts/dev.mjs npm-version)
        shell: bash
      - name: Resolve existing tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$PUSH_TAG"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || { echo "Tag does not exist: $TAG" >&2; exit 1; }
          COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [ "$COMMIT" != "$CHECKED_OUT_COMMIT" ]; then
            echo "Checked out $CHECKED_OUT_COMMIT but tag $TAG resolves to $COMMIT" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if EXISTING_RELEASE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish' 2>/dev/null)"; then
            if [[ ! "$EXISTING_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ || "$EXISTING_RELEASE_COMMIT" != "$COMMIT" ]]; then
              echo "Release $TAG already exists for '$EXISTING_RELEASE_COMMIT'; refusing to republish from $COMMIT" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          CODEPRISM_RELEASE_TAG="$TAG" node scripts/dev.mjs version-check

  quality:
    name: Release quality gate
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@$(node scripts/dev.mjs npm-version)
        shell: bash
      - id: rust-toolchain
        run: echo "version=$(node scripts/dev.mjs rust-toolchain-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: clippy,rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  package:
    name: Package ${{ matrix.target }}
    needs: [resolve, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@$(node scripts/dev.mjs npm-version)
        shell: bash
      - id: rust-toolchain
        run: echo "version=$(node scripts/dev.mjs rust-toolchain-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build target binary
        env:
          CODEPRISM_SKIP_WEB_BUILD: '1'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Assemble and verify package
        run: npm run package -- --target ${{ matrix.target }} --prebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: codeprism-${{ matrix.target }}
          path: .codeprism-release/codeprism-${{ matrix.target }}.*

  docker-verify:
    name: Build and run Docker image
    needs: [resolve, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: codeprism-x86_64-unknown-linux-gnu
          path: package
      - name: Prepare Docker context
        run: |
          mkdir docker-build
          tar xzf package/codeprism-x86_64-unknown-linux-gnu.tar.gz -C docker-build
      - name: Build and verify image locally
        run: |
          docker build -t codeprism-release-check:${{ needs.resolve.outputs.version }} .
          docker run --rm codeprism-release-check:${{ needs.resolve.outputs.version }} --version
          mkdir -p docker-config
          docker run --rm -v "$PWD/docker-config:/workspace" codeprism-release-check:${{ needs.resolve.outputs.version }} init-config codeprism.yaml
          docker run --rm -v "$PWD/docker-config:/workspace" codeprism-release-check:${{ needs.resolve.outputs.version }} --config codeprism.yaml check-config
          docker run --rm -v "$PWD/docker-config:/workspace" -e CODEPRISM_ANALYZERS_DIR=/usr/local/share/codeprism/custom_analyzers codeprism-release-check:${{ needs.resolve.outputs.version }} test-analyzers
          docker save codeprism-release-check:${{ needs.resolve.outputs.version }} -o codeprism-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: codeprism-docker-image
          path: codeprism-image.tar

  publish:
    name: Publish verified release
    needs: [resolve, package, docker-verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create combined checksums
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.commit }}
          name: CodePrism ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated Docker image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ contains(needs.resolve.outputs.version, '-') }}
        run: |
          docker load -i artifacts/codeprism-docker-image/codeprism-image.tar
          docker tag "codeprism-release-check:$VERSION" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          if [ "$PRERELEASE" = "false" ]; then
            docker tag "codeprism-release-check:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
