[workspace]
members = [
    "crates/core",
    "crates/database",
    "crates/git_scanner",
    "crates/analyzer",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.92"

[package]
name = "codeprism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
codeprism-core = { path = "crates/core" }
codeprism-database = { path = "crates/database" }
codeprism-scanner = { path = "crates/git_scanner" }
codeprism-analyzer = { path = "crates/analyzer" }
codeprism-server = { path = "crates/server" }

anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1.49.0", features = ["full"] }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
git2 = "0.20.3"
